<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeri Aset Phincon</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        text-align: center;
        background-color: #f5f5f5;
      }
      .container {
        max-width: 800px;
        margin: 20px auto;
        padding: 20px;
        background: white;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
      }
      .login-box {
        max-width: 300px;
        margin: 50px auto;
        padding: 20px;
        background: white;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
      }
      .login-box h2 {
        margin-bottom: 20px;
      }
      .login-box input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      .login-box button {
        width: 100%;
        padding: 10px;
        background: green;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      .login-box button:hover {
        background: darkgreen;
      }
      .nav a {
        display: block;
        margin: 10px auto;
        padding: 10px;
        text-decoration: none;
        color: white;
        background-color: #007bff;
        border-radius: 5px;
        width: 200px;
        font-weight: bold;
      }
      .nav a:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Galeri Aset Phincon</h1>
      <div id="loginBox" class="login-box">
        <h2>Silakan Login</h2>
        <input type="text" id="username" placeholder="Username" />
        <input type="password" id="password" placeholder="Password" />
        <button onclick="login()">Login</button>
      </div>
      <div id="gallery" style="display: none">
        <p>Pilih salah satu galeri berikut:</p>
        <div class="nav">
          <a href="Kokas.zip">Kokas Galeri</a>
          <a href="Batavia.zip">Batavia Galeri</a>
          <a href="Gandaria.zip">Gancit Galeri</a>
        </div>
        <button onclick="logout()">Logout</button>
      </div>
    </div>
    <script>
      const encodedUsername = "UGhpbmNvbg==";
      const encodedPassword = "R0EyMDI1";

      function login() {
        const userInput = btoa(document.getElementById("username").value);
        const passInput = btoa(document.getElementById("password").value);

        if (userInput === encodedUsername && passInput === encodedPassword) {
          sessionStorage.setItem("loggedIn", true);
          document.getElementById("loginBox").style.display = "none";
          document.getElementById("gallery").style.display = "block";
        } else {
          alert("Username atau Password salah");
        }
      }

      function logout() {
        sessionStorage.removeItem("loggedIn");
        document.getElementById("gallery").style.display = "none";
        document.getElementById("loginBox").style.display = "block";
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
      }

      window.onload = function () {
        if (sessionStorage.getItem("loggedIn")) {
          document.getElementById("loginBox").style.display = "none";
          document.getElementById("gallery").style.display = "block";
        }
      };
    </script>
  </body>
</html>
