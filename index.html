<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeri Foto</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        text-align: center;
        background-color: #f5f5f5;
      }
      .container {
        max-width: 800px;
        margin: 20px auto;
        padding: 20px;
        background: white;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
      }
      .nav {
        margin: 20px;
      }
      .nav a {
        display: block;
        margin: 10px auto;
        padding: 10px;
        text-decoration: none;
        color: white;
        background-color: #007bff;
        border-radius: 5px;
        width: 200px;
        font-weight: bold;
      }
      .nav a:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Galeri Aset Phincon</h1>
      <p>Pilih salah satu galeri berikut:</p>
      <div class="nav">
        <a href="Kokas.zip">Kokas Galeri</a>
        <a href="Batavia.zip">Batavia Galeri</a>
        <a href="Gancit.zip">Gancit Galeri</a>
      </div>
    </div>
  </body>
</html>
