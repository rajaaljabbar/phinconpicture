<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeri Foto Batavia</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        text-align: center;
        background-color: #f5f5f5;
      }
      .container {
        max-width: 800px;
        margin: 20px auto;
        padding: 20px;
        background: white;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
      }
      .gallery img {
        width: 100%;
        height: auto;
        max-width: 250px;
        border-radius: 10px;
      }
      .gallery p {
        font-size: 14px;
        color: #333;
        text-align: center;
        margin-top: 10px;
        margin-bottom: 30px;
      }
      .nav {
        margin: 20px;
      }
      .nav a {
        margin: 0 10px;
        text-decoration: none;
        color: #007bff;
        font-weight: bold;
      }
      .download-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Foto Aset Phincon</h1>
      <div class="nav">
        <a href="index.html">Back To Main Menu</a>
      </div>
      <div class="nav">
        <a href="page1.html">Office 88, Kokas</a>
        <a href="page2.html">Batavia Tower</a>
        <a href="page3.html">Office 8, Gancit</a>
      </div>
      <div class="gallery">
        <img src="img/Batavia/Unifi-Batavia.jpeg" alt="Batavia 1" />
        <p>Unifi - Batavia</p>
        <img src="img/Batavia/Printer-Batavia.jpeg" alt="Batavia 2" />
        <p>Printer - Batavia</p>
        <img src="img/Batavia/ServerRoom-Batavia.jpeg" alt="Batavia 3" />
        <p>Switch, Mikrotik, Server, NVR CCTV</p>
        <img src="img/Batavia/SmartTV-Batavia.jpeg" alt="Batavia 4" />
        <p>Smart TV & Console Game</p>
        <img src="img/Batavia/Dell-Batavia.jpeg" alt="Batavia 5" />
        <p>Device - Dell Inspiron 5440</p>
        <img src="img/Batavia/Apple-Batavia.jpeg" alt="Batavia 6" />
        <p>Device - Macbook M3 Pro</p>
      </div>
      <script>
        const currentPage = window.location.pathname;
        if (currentPage.includes("page1.html")) {
          document.write(
            '<a href="Kokas.zip" class="download-btn" download>Download Kokas Galeri</a>'
          );
        } else if (currentPage.includes("page2.html")) {
          document.write(
            '<a href="Batavia.zip" class="download-btn" download>Download Batavia Galeri</a>'
          );
        } else if (currentPage.includes("page3.html")) {
          document.write(
            '<a href="Gancit.zip" class="download-btn" download>Download Gancit Galeri</a>'
          );
        }
      </script>
    </div>
  </body>
</html>
